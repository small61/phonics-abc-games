<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#dff3f5"><title>小兔字母邮局</title><link rel="stylesheet" href="alphabet-adventure.css?v=7"></head><body><main>
<header><a href="phonics-abc-star-adventure.html">← 游戏屋</a><span>🐾 小兔字母邮局</span><button id="change">家长设置</button></header>
<section id="setup"><div class="intro-land"><span class="cloud cloud-one"></span><span class="cloud cloud-two"></span><span class="sun"></span><div class="intro-bunny"><svg viewBox="0 0 120 140" class="bunny-art" aria-hidden="true"><ellipse cx="62" cy="129" rx="37" ry="7" fill="#294e4b" opacity=".12"/><path d="M36 59C9 12 36-6 48 47M68 48C76-8 105 4 85 65" fill="#fffef5" stroke="#355a5b" stroke-width="3.5"/><path d="M36 25l7 24M84 22l-7 28" stroke="#f2b9aa" stroke-width="9" stroke-linecap="round"/><ellipse cx="61" cy="102" rx="32" ry="28" fill="#fffef5" stroke="#355a5b" stroke-width="3.5"/><path d="M39 100l-7 20M84 99l8 19" stroke="#355a5b" stroke-width="4" stroke-linecap="round"/><ellipse cx="61" cy="71" rx="38" ry="31" fill="#fffef5" stroke="#355a5b" stroke-width="3.5"/><circle cx="48" cy="69" r="3.3" fill="#355a5b"/><circle cx="75" cy="69" r="3.3" fill="#355a5b"/><ellipse cx="37" cy="80" rx="7" ry="4" fill="#f2b9aa"/><ellipse cx="86" cy="80" rx="7" ry="4" fill="#f2b9aa"/><path d="M58 77l4 3 4-3m-4 4q0 8-6 6m6-6q0 8 6 6" fill="none" stroke="#355a5b" stroke-width="2.5" stroke-linecap="round"/><path d="M37 97l47 0-3 19H40z" fill="#f0a85c"/><path d="M37 97l24 13 23-13" fill="none" stroke="#b57942" stroke-width="2.5"/></svg></div><span class="intro-mail">✉</span><span class="intro-flower">✿</span><span class="intro-grass">❀</span><span class="postbox">📮</span></div><div class="intro-copy"><h1>和小兔一起<br>送字母信吧！</h1><p>听声音，找朋友，装满你的字母贴纸册。</p><button id="start" class="primary">出发去送信 <span aria-hidden="true">➜</span></button><div class="mission-preview"><div><span>📻</span><b>听音送信</b><small>听一听，选字母</small></div><div><span>💌</span><b>字母交朋友</b><small>大写小写配成对</small></div><div><span>🎁</span><b>收集小礼物</b><small>每 4 根胡萝卜开一次</small></div></div></div><details id="parentSettings"><summary>家长设置 · 默认 A–L</summary><p>目标和干扰字母都来自所选范围，至少选 4 个。</p><div class="tools"><button id="al">已学 A–L</button><button id="az">全部 A–Z</button></div><fieldset><legend>选择练习字母</legend><div id="letters"></div></fieldset><p id="range" role="status"></p></details></section>
<section id="game" hidden><ol id="stages" aria-label="选择起始关卡"><li><button type="button" data-mode="0">📻 听音送信</button></li><li><button type="button" data-mode="1">💌 大小写配对</button></li></ol><p class="stage-help">切换玩法会重新出发</p>
<div class="journey" aria-label="小兔送信旅程"><span class="cloud cloud-one"></span><span class="journey-tree">♣</span><div class="trail"></div><div id="journeyRabbit"><svg viewBox="0 0 120 140" class="bunny-art" aria-hidden="true"><ellipse cx="62" cy="129" rx="37" ry="7" fill="#294e4b" opacity=".12"/><path d="M36 59C9 12 36-6 48 47M68 48C76-8 105 4 85 65" fill="#fffef5" stroke="#355a5b" stroke-width="3.5"/><path d="M36 25l7 24M84 22l-7 28" stroke="#f2b9aa" stroke-width="9" stroke-linecap="round"/><ellipse cx="61" cy="102" rx="32" ry="28" fill="#fffef5" stroke="#355a5b" stroke-width="3.5"/><path d="M39 100l-7 20M84 99l8 19" stroke="#355a5b" stroke-width="4" stroke-linecap="round"/><ellipse cx="61" cy="71" rx="38" ry="31" fill="#fffef5" stroke="#355a5b" stroke-width="3.5"/><circle cx="48" cy="69" r="3.3" fill="#355a5b"/><circle cx="75" cy="69" r="3.3" fill="#355a5b"/><ellipse cx="37" cy="80" rx="7" ry="4" fill="#f2b9aa"/><ellipse cx="86" cy="80" rx="7" ry="4" fill="#f2b9aa"/><path d="M58 77l4 3 4-3m-4 4q0 8-6 6m6-6q0 8 6 6" fill="none" stroke="#355a5b" stroke-width="2.5" stroke-linecap="round"/><path d="M37 97l47 0-3 19H40z" fill="#f0a85c"/><path d="M37 97l24 13 23-13" fill="none" stroke="#b57942" stroke-width="2.5"/></svg></div><span class="journey-home">🏡</span><div class="journey-label">字母邮局 <span aria-hidden="true">→</span> 森林小屋</div><span id="rewardFloat" aria-hidden="true"></span></div>
<div class="reward-bar"><span id="carrotCount" role="status">🥕 0</span><span id="streak" role="status">准备出发</span><button id="gift" disabled>🎁 再收集 4 根</button></div><div id="giftMessage" role="status"></div>
<div class="mission-heading"><span id="scene" aria-hidden="true"></span><h1 id="prompt"></h1><span id="count"></span></div><progress id="progress" value="0" max="14" aria-label="探险进度"></progress><p id="instruction"></p><div id="target" aria-label="目标字母"></div><button id="replay" class="listen"><span aria-hidden="true">◖ ♪ ◗</span> 再听一次</button><p id="audioStatus" role="status"></p><p id="miniProgress" role="status"></p><div id="boardWrap"><svg id="pairLines" aria-hidden="true"></svg><div id="choices"></div></div><p id="feedback" aria-live="polite"></p>
<details id="album"><summary id="albumTitle">字母贴纸册</summary><div id="stickers"></div></details><div id="rabbit" aria-hidden="true"></div><button id="retry" class="quiet">重新出发</button></section>
<section id="done" hidden><div class="finish-art"><svg viewBox="0 0 120 140" class="bunny-art" aria-hidden="true"><ellipse cx="62" cy="129" rx="37" ry="7" fill="#294e4b" opacity=".12"/><path d="M36 59C9 12 36-6 48 47M68 48C76-8 105 4 85 65" fill="#fffef5" stroke="#355a5b" stroke-width="3.5"/><path d="M36 25l7 24M84 22l-7 28" stroke="#f2b9aa" stroke-width="9" stroke-linecap="round"/><ellipse cx="61" cy="102" rx="32" ry="28" fill="#fffef5" stroke="#355a5b" stroke-width="3.5"/><path d="M39 100l-7 20M84 99l8 19" stroke="#355a5b" stroke-width="4" stroke-linecap="round"/><ellipse cx="61" cy="71" rx="38" ry="31" fill="#fffef5" stroke="#355a5b" stroke-width="3.5"/><circle cx="48" cy="69" r="3.3" fill="#355a5b"/><circle cx="75" cy="69" r="3.3" fill="#355a5b"/><ellipse cx="37" cy="80" rx="7" ry="4" fill="#f2b9aa"/><ellipse cx="86" cy="80" rx="7" ry="4" fill="#f2b9aa"/><path d="M58 77l4 3 4-3m-4 4q0 8-6 6m6-6q0 8 6 6" fill="none" stroke="#355a5b" stroke-width="2.5" stroke-linecap="round"/><path d="M37 97l47 0-3 19H40z" fill="#f0a85c"/><path d="M37 97l24 13 23-13" fill="none" stroke="#b57942" stroke-width="2.5"/></svg><span>🏆</span></div><h1>信都送到啦！</h1><p id="summary"></p><p id="finishRewards"></p><div id="finishStickers"></div><button id="finishGift">🎁 打开剩余礼物</button><button id="again" class="primary">再出发一次</button><button id="choose" class="quiet">更换练习字母</button></section></main><script src="alphabet-adventure.js?v=7"></script></body></html>
