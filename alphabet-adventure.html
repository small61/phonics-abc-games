<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173f5f"><title>ABC 字母探险</title><link rel="stylesheet" href="alphabet-adventure.css?v=4"></head>
<body><main><header><a href="phonics-abc-star-adventure.html">← 原有游戏</a><span>🐰 ABC 字母探险</span><button id="change">更换字母</button></header>
<section id="setup"><h1>一起认识字母吧！</h1><p>两种玩法：📻 听音电台 → 🤝 字母交朋友</p><p>默认只练 A–L。目标与干扰项都来自所选字母。</p><div class="tools"><button id="al">已学 A–L</button><button id="az">全部 A–Z</button></div><fieldset><legend>家长选择练习字母（至少 4 个）</legend><div id="letters"></div></fieldset><p id="range" role="status"></p><button id="start" class="primary">🔊 开始探险</button></section>
<section id="game" hidden><ol id="stages" aria-label="选择起始关卡"><li><button type="button" data-mode="0">听字母</button></li><li><button type="button" data-mode="1">大小写</button></li></ol><p class="stage-help">点击关卡可从这里重新开始，之后继续挑战另一关。</p><p id="count"></p><progress id="progress" value="0" max="15" aria-label="探险进度"></progress><div id="scene" aria-hidden="true"></div><h1 id="prompt"></h1><p id="instruction"></p><div id="target" aria-label="目标字母"></div><button id="replay" class="primary">🔊 再听一次</button><p id="audioStatus" role="status"></p><p id="miniProgress" role="status"></p><div id="choices"></div><p id="feedback" aria-live="polite"></p><div id="rabbit" aria-hidden="true">🐰 ⭐</div><button id="retry">重新闯关</button></section>
<section id="done" hidden><h1>🏆 两关全部完成！</h1><p id="summary"></p><button id="again" class="primary">再玩一次</button><button id="choose">更换练习字母</button></section></main><script src="alphabet-adventure.js?v=4"></script></body></html>
