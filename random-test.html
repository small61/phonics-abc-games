<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#173f5f"><title>ABC 随机测试</title>
<style>
:root{--navy:#173f5f;--coral:#ff6b5e;--yellow:#ffd84d;--green:#51c89d;--cream:#fff9e9;--ink:#19343f;--shadow:0 12px 28px #173f5f25}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;min-height:100svh;background:var(--cream);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}button,a{font:inherit;touch-action:manipulation}.app{width:min(760px,100%);min-height:100svh;margin:auto;padding:16px clamp(14px,4vw,34px) 24px;display:flex;flex-direction:column;gap:14px}header{display:flex;align-items:center;justify-content:space-between}.back{width:50px;height:50px;border:0;border-radius:16px;display:grid;place-items:center;background:#fff;color:var(--navy);box-shadow:var(--shadow);font-size:1.45rem;text-decoration:none}.brand{text-align:center;flex:1}.brand h1{margin:0;color:var(--navy);font-size:clamp(1.35rem,5vw,2rem)}.brand p{margin:4px 0 0;color:#68808a;font-weight:800}.score{min-width:50px;text-align:right;font-weight:950;color:var(--navy)}.game{background:#fff;border-radius:28px;padding:18px;box-shadow:var(--shadow);flex:1;display:flex;flex-direction:column;gap:14px;min-height:500px}.mission{text-align:center}.mission h2{margin:0;color:var(--navy);font-size:clamp(1.25rem,4vw,1.7rem)}.mission p{min-height:24px;margin:5px 0 0;color:#687f87;font-weight:700}.scope{border:2px solid #dce9e8;border-radius:18px;background:#f8fbfb;color:var(--navy)}.scope summary{cursor:pointer;padding:12px 14px;font-weight:900;list-style:none}.scope summary::-webkit-details-marker{display:none}.scope summary::after{content:'⌄';float:right;font-size:1.3rem}.scope[open] summary::after{transform:rotate(180deg)}.scope-body{padding:0 12px 12px;display:flex;gap:8px;flex-wrap:wrap}.unit{flex:1 1 27%;min-width:72px;min-height:44px;border:2px solid #cfe0e1;border-radius:13px;background:#fff;display:grid;place-items:center;font-weight:950}.unit:has(input:checked){background:#e8fff6;border-color:#32b887}.unit input{position:absolute;opacity:0}.listen{align-self:center;min-height:66px;border:0;border-radius:20px;padding:0 30px;background:var(--coral);color:#fff;font-size:1.2rem;font-weight:950;box-shadow:0 6px 0 #d84c43}.listen:active{transform:translateY(3px);box-shadow:0 3px 0 #d84c43}.speed{align-self:center;min-height:42px;border:2px solid #d6e2e3;border-radius:999px;background:#fff;padding:0 18px;color:var(--navy);font-weight:800}.board{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;flex:1}.card{border:3px solid transparent;border-radius:23px;background:#f8fbfb;min-height:155px;padding:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;color:var(--ink);box-shadow:0 6px 14px #173f5f15}.pic{font-size:clamp(3rem,12vw,5rem);line-height:1}.pic img{width:clamp(4.8rem,16vw,6.4rem);height:clamp(4.8rem,16vw,6.4rem);object-fit:cover;border-radius:18px;display:block}.word{font:900 clamp(1.15rem,4.5vw,1.7rem) Georgia}.good{border-color:#32b887;background:#e8fff6;animation:pop .45s}.bad{border-color:var(--coral);animation:shake .3s}.feedback{text-align:center;min-height:28px;color:#168161;font-weight:900;font-size:1.05rem}.progress{height:12px;border-radius:99px;background:#e5efef;overflow:hidden}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--yellow),var(--green));transition:width .35s}@keyframes pop{50%{transform:scale(1.08)}}@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}:focus-visible{outline:4px solid var(--yellow);outline-offset:3px}@media(max-width:430px){.app{padding-inline:11px}.game{padding:14px}.card{min-height:135px}}@media(orientation:landscape) and (max-height:680px){.app{gap:8px;padding-top:8px}.game{min-height:340px;padding:12px}.scope{position:absolute;z-index:2;left:12px;right:12px}.board{grid-template-columns:repeat(4,1fr)}.card{min-height:155px}.listen{min-height:54px}}
</style>
</head>
<body><main class="app">
<header><a class="back" href="phonics-abc-star-adventure.html" aria-label="返回闯关">←</a><div class="brand"><h1>🎲 随机测试</h1><p>随机听音 · 四选一</p></div><div class="score" id="score">0 / 104</div></header>
<section class="game"><div class="mission"><h2 id="title">准备好了吗？</h2><p id="hint">104 个已校准单词，随机出题</p></div><details class="scope"><summary>测试范围：全部 A–Z</summary><div class="scope-body"><label class="unit"><input type="checkbox" value="A" checked>A 组</label><label class="unit"><input type="checkbox" value="B" checked>B 组</label><label class="unit"><input type="checkbox" value="C" checked>C 组</label><label class="unit"><input type="checkbox" value="D" checked>D 组</label><label class="unit"><input type="checkbox" value="E" checked>E 组</label><label class="unit"><input type="checkbox" value="F" checked>F 组</label><label class="unit"><input type="checkbox" value="G" checked>G 组</label><label class="unit"><input type="checkbox" value="H" checked>H 组</label><label class="unit"><input type="checkbox" value="I" checked>I 组</label><label class="unit"><input type="checkbox" value="J" checked>J 组</label><label class="unit"><input type="checkbox" value="K" checked>K 组</label><label class="unit"><input type="checkbox" value="L" checked>L 组</label><label class="unit"><input type="checkbox" value="M" checked>M 组</label><label class="unit"><input type="checkbox" value="N" checked>N 组</label><label class="unit"><input type="checkbox" value="O" checked>O 组</label><label class="unit"><input type="checkbox" value="P" checked>P 组</label><label class="unit"><input type="checkbox" value="Q" checked>Q 组</label><label class="unit"><input type="checkbox" value="R" checked>R 组</label><label class="unit"><input type="checkbox" value="S" checked>S 组</label><label class="unit"><input type="checkbox" value="T" checked>T 组</label><label class="unit"><input type="checkbox" value="U" checked>U 组</label><label class="unit"><input type="checkbox" value="V" checked>V 组</label><label class="unit"><input type="checkbox" value="W" checked>W 组</label><label class="unit"><input type="checkbox" value="X" checked>X 组</label><label class="unit"><input type="checkbox" value="Y" checked>Y 组</label><label class="unit"><input type="checkbox" value="Z" checked>Z 组</label></div></details><button class="listen" id="listen">🎮 开始随机测试</button><button class="speed" id="speed">🐇 正常</button><div class="progress"><i id="bar"></i></div><div class="board" id="board"></div><div class="feedback" id="feedback" aria-live="assertive"></div></section>
</main><script>
(()=>{'use strict';const words=[['apple','🍎','audio/a-apple.mp3'],['ant','🐜','audio/a-ant.mp3'],['alligator','🐊','audio/a-alligator.mp3'],['axe','🪓','audio/a-ax.mp3'],['bear','🐻','audio/b-bear.mp3'],['bird','🐦','audio/b-bird.mp3'],['bed','🛏️','audio/b-bed.mp3'],['banana','🍌','audio/b-banana.mp3'],['cat','🐱','audio/c-cat.mp3'],['cup','☕','audio/c-cup.mp3'],['car','🚗','audio/c-car.mp3'],['computer','💻','audio/c-computer.mp3'],['dog','🐶','audio/d-dog.mp3'],['desk','🪑','audio/d-desk.mp3'],['doll','🪆','audio/d-doll.mp3'],['duck','🦆','audio/d-duck.mp3'],['egg','🥚','audio/e-egg.mp3'],['elbow','💪','audio/e-elbow.mp3'],['envelope','✉️','audio/e-envelope.mp3'],['elephant','🐘','audio/e-elephant.mp3'],['fish','🐟','audio/f-fish.mp3'],['fan','🪭','audio/f-fan.mp3'],['farm','🏡','audio/f-farm.mp3'],['fork','🍴','audio/f-fork.mp3'],['gorilla','🦍','audio/g-gorilla.mp3'],['goat','🐐','audio/g-goat.mp3'],['gift','🎁','audio/g-gift.mp3'],['girl','👧','audio/g-girl.mp3'],['horse','🐎','audio/h-horse.mp3'],['hat','🎩','audio/h-hat.mp3'],['house','🏠','audio/h-house.mp3'],['hot dog','🌭','audio/h-hot-dog.mp3'],['insect','🐛','audio/i-insect.mp3'],['ink','🖋️','audio/i-ink.mp3'],['igloo','🧊','audio/i-igloo.mp3'],['iguana','🦎','audio/i-iguana.mp3'],['jet','✈️','audio/j-jet.mp3'],['jam','🍓','audio/j-jam.mp3'],['juice','🧃','audio/j-juice.mp3'],['jacket','🧥','audio/j-jacket.mp3'],['kangaroo','🦘','audio/k-kangaroo.mp3'],['key','🔑','audio/k-key.mp3'],['king','👑','audio/k-king.mp3'],['kite','🪁','audio/k-kite.mp3'],['lion','🦁','audio/l-lion.mp3'],['lamp','💡','audio/l-lamp.mp3'],['leaf','🍃','audio/l-leaf.mp3'],['lemon','🍋','audio/l-lemon.mp3'],['monkey','🐒','audio/m-monkey.mp3'],['milk','🥛','audio/m-milk.mp3'],['money','💵','audio/m-money.mp3'],['mouse','🐭','audio/m-mouse.mp3'],['nut','🥜','audio/n-nut.mp3'],['net','🥅','audio/n-net.mp3'],['nest','🪺','audio/n-nest.mp3'],['nose','👃','audio/n-nose.mp3'],['octopus','🐙','audio/o-octopus.mp3'],['ox','🐂','audio/o-ox.mp3'],['olive','🫒','audio/o-olive.mp3'],['ostrich','🐦','audio/o-ostrich.mp3'],['peach','🍑','audio/p-peach.mp3'],['pen','🖊️','audio/p-pen.mp3'],['panda','🐼','audio/p-panda.mp3'],['pineapple','🍍','audio/p-pineapple.mp3'],['queen','👸','audio/q-queen.mp3'],['quiz','📝','audio/q-quiz.mp3'],['quilt','🛏️','audio/q-quilt.mp3'],['question','❓','audio/q-question.mp3'],['rabbit','🐇','audio/r-rabbit.mp3'],['rose','🌹','audio/r-rose.mp3'],['rice','🍚','audio/r-rice.mp3'],['robot','🤖','audio/r-robot.mp3'],['seal','🦭','audio/s-seal.mp3'],['sun','☀️','audio/s-sun.mp3'],['soap','🧼','audio/s-soap.mp3'],['socks','🧦','audio/s-socks.mp3'],['turtle','🐢','audio/t-turtle.mp3'],['tent','⛺','audio/t-tent.mp3'],['tiger','🐅','audio/t-tiger.mp3'],['teacher','👩‍🏫','audio/t-teacher.mp3'],['umbrella','☂️','audio/u-umbrella.mp3'],['up','⬆️','audio/u-up.mp3'],['uncle','👨','audio/u-uncle.mp3'],['umpire','🧑‍⚖️','audio/u-umpire.mp3'],['van','🚐','audio/v-van.mp3'],['vet','👩‍⚕️','audio/v-vet.mp3'],['vest','🦺','audio/v-vest.mp3'],['violin','🎻','audio/v-violin.mp3'],['wolf','🐺','audio/w-wolf.mp3'],['web','🕸️','audio/w-web.mp3'],['water','💧','audio/w-water.mp3'],['watch','⌚','audio/w-watch.mp3'],['fox','🦊','audio/x-fox.mp3'],['box','📦','audio/x-box.mp3'],['six','6️⃣','audio/x-six.mp3'],['wax','🕯️','audio/x-wax.mp3'],['yo-yo','🪀','audio/y-yo-yo.mp3'],['yak','🐂','audio/y-yak.mp3'],['yogurt','🥛','audio/y-yogurt.mp3'],['yacht','⛵','audio/y-yacht.mp3'],['zipper','🤐','audio/z-zipper.mp3'],['zero','0️⃣','audio/z-zero.mp3'],['zoo','🦓','audio/z-zoo.mp3'],['zebra','🦓','audio/z-zebra.mp3']];const $=s=>document.querySelector(s),board=$('#board'),feedback=$('#feedback'),scope=$('.scope'),scopeSummary=$('.scope summary'),checks=[...document.querySelectorAll('.scope input')],pictures={farm:'assets/farm-card.png',desk:'assets/desk-card.png',ink:'assets/ink-card.png',igloo:'assets/igloo-card.png',jam:'assets/jam-card.png',lamp:'assets/lamp-card.png',net:'assets/net-card.png',ostrich:'assets/ostrich-card.png',quilt:'assets/quilt-card.png',umpire:'assets/umpire-card.png',vet:'assets/vet-card.png',wax:'assets/wax-card.png',yak:'assets/yak-card.png',yogurt:'assets/yogurt-card.png',zipper:'assets/zipper-card.png',zoo:'assets/zoo-card.png'};let bag=[],answer=null,started=false,correct=0,slow=false,player=new Audio(),locked=false,nextTimer=0;const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};const selectedUnits=()=>checks.filter(x=>x.checked).map(x=>x.value);const activeWords=()=>{const units=selectedUnits();return words.filter((_,i)=>units.includes('ABCDEFGHIJKLMNOPQRSTUVWXYZ'[Math.floor(i/4)]))};const total=()=>activeWords().length;function updateScope(){clearTimeout(nextTimer);const units=selectedUnits();scopeSummary.textContent='测试范围：'+(units.length===26?'全部 A–Z':units.length?units.join('、')+' 组':'请选择至少一组');if(!units.length)return;player.pause();bag=[];answer=null;started=false;correct=0;locked=false;board.innerHTML='';$('#title').textContent='准备好了吗？';$('#hint').textContent=total()+' 个已校准单词，随机出题';$('#listen').textContent='🎮 开始随机测试';feedback.textContent='';paint()}function play(){if(!answer)return;player.pause();if(!player.src.endsWith(answer[2])){player.src=answer[2];player.load()}player.currentTime=0;player.playbackRate=slow?.78:1;player.preservesPitch=true;player.mozPreservesPitch=true;player.webkitPreservesPitch=true;player.play().catch(()=>feedback.textContent='原声暂未播放，请再点一次')}function paint(){const count=total(),done=count-bag.length-(started?1:0);$('#score').textContent=correct+' / '+count;$('#bar').style.width=(count?Math.max(0,done)/count*100:0)+'%'}function ask(){locked=false;feedback.textContent='';if(!bag.length){answer=null;$('#title').textContent='完成啦！';$('#hint').textContent='答对 '+correct+' 题，再来一轮吧！';$('#listen').textContent='🔁 再来一轮';board.innerHTML='';paint();started=false;return}answer=bag.shift();const pool=activeWords().filter(x=>x!==answer);const choices=shuffle([answer,...shuffle(pool).slice(0,3)]);$('#title').textContent='听一听，点出正确图片';$('#hint').textContent='点击“再听一次”可重复播放';$('#listen').textContent='🔊 再听一次';board.innerHTML='';choices.forEach(w=>{const b=document.createElement('button');b.className='card';const pic=pictures[w[0]]?`<img src="${pictures[w[0]]}" alt="">`:w[1];b.innerHTML=`<span class="pic">${pic}</span><span class="word">${w[0]}</span>`;b.onclick=()=>choose(w,b);board.appendChild(b)});paint()}function choose(w,b){if(locked||!started)return;if(w===answer){locked=true;correct++;b.classList.add('good');feedback.textContent='答对了！下一题来了';paint();nextTimer=setTimeout(()=>{ask();if(answer)play()},700)}else{b.classList.add('bad');setTimeout(()=>b.classList.remove('bad'),300);feedback.textContent='再听一次，加油！';play()}}checks.forEach(x=>x.onchange=()=>{if(!selectedUnits().length){x.checked=true;feedback.textContent='至少选择一组';return}updateScope()});$('#listen').onclick=()=>{if(!started){const set=activeWords();if(!set.length)return;started=true;bag=shuffle([...set]);correct=0;scope.open=false;ask()}play()};$('#speed').onclick=e=>{slow=!slow;e.currentTarget.textContent=slow?'🐢 慢速':'🐇 正常';if(started)play()};updateScope()})();
</script></body></html>
