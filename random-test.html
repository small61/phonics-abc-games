<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#173f5f"><title>ABC 随机测试</title>
<style>
:root{--navy:#173f5f;--coral:#ff6b5e;--yellow:#ffd84d;--green:#51c89d;--cream:#fff9e9;--ink:#19343f;--shadow:0 12px 28px #173f5f25}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;min-height:100svh;background:var(--cream);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}button,a{font:inherit;touch-action:manipulation}.app{width:min(760px,100%);min-height:100svh;margin:auto;padding:16px clamp(14px,4vw,34px) 24px;display:flex;flex-direction:column;gap:14px}header{display:flex;align-items:center;justify-content:space-between}.back{width:50px;height:50px;border:0;border-radius:16px;display:grid;place-items:center;background:#fff;color:var(--navy);box-shadow:var(--shadow);font-size:1.45rem;text-decoration:none}.brand{text-align:center;flex:1}.brand h1{margin:0;color:var(--navy);font-size:clamp(1.35rem,5vw,2rem)}.brand p{margin:4px 0 0;color:#68808a;font-weight:800}.score{min-width:50px;text-align:right;font-weight:950;color:var(--navy)}.game{background:#fff;border-radius:28px;padding:18px;box-shadow:var(--shadow);flex:1;display:flex;flex-direction:column;gap:14px;min-height:500px}.mission{text-align:center}.mission h2{margin:0;color:var(--navy);font-size:clamp(1.25rem,4vw,1.7rem)}.mission p{min-height:24px;margin:5px 0 0;color:#687f87;font-weight:700}.listen{align-self:center;min-height:66px;border:0;border-radius:20px;padding:0 30px;background:var(--coral);color:#fff;font-size:1.2rem;font-weight:950;box-shadow:0 6px 0 #d84c43}.listen:active{transform:translateY(3px);box-shadow:0 3px 0 #d84c43}.speed{align-self:center;min-height:42px;border:2px solid #d6e2e3;border-radius:999px;background:#fff;padding:0 18px;color:var(--navy);font-weight:800}.board{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;flex:1}.card{border:3px solid transparent;border-radius:23px;background:#f8fbfb;min-height:155px;padding:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;color:var(--ink);box-shadow:0 6px 14px #173f5f15}.pic{font-size:clamp(3rem,12vw,5rem);line-height:1}.word{font:900 clamp(1.15rem,4.5vw,1.7rem) Georgia}.good{border-color:#32b887;background:#e8fff6;animation:pop .45s}.bad{border-color:var(--coral);animation:shake .3s}.feedback{text-align:center;min-height:28px;color:#168161;font-weight:900;font-size:1.05rem}.progress{height:12px;border-radius:99px;background:#e5efef;overflow:hidden}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--yellow),var(--green));transition:width .35s}@keyframes pop{50%{transform:scale(1.08)}}@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}:focus-visible{outline:4px solid var(--yellow);outline-offset:3px}@media(max-width:430px){.app{padding-inline:11px}.game{padding:14px}.card{min-height:135px}}@media(orientation:landscape) and (max-height:680px){.app{gap:8px;padding-top:8px}.game{min-height:340px;padding:12px}.board{grid-template-columns:repeat(4,1fr)}.card{min-height:155px}.listen{min-height:54px}}
</style>
</head>
<body><main class="app">
<header><a class="back" href="phonics-abc-star-adventure.html" aria-label="返回闯关">←</a><div class="brand"><h1>🎲 随机测试</h1><p>随机听音 · 四选一</p></div><div class="score" id="score">0 / 24</div></header>
<section class="game"><div class="mission"><h2 id="title">准备好了吗？</h2><p id="hint">24 个已校准单词，随机出题</p></div><button class="listen" id="listen">🎮 开始随机测试</button><button class="speed" id="speed">🐢 慢速</button><div class="progress"><i id="bar"></i></div><div class="board" id="board"></div><div class="feedback" id="feedback" aria-live="assertive"></div></section>
</main><script>
(()=>{'use strict';const words=[['apple','🍎','audio/a-apple.mp3'],['ant','🐜','audio/a-ant.mp3'],['alligator','🐊','audio/a-alligator.mp3'],['axe','🪓','audio/a-ax.mp3'],['bear','🐻','audio/b-bear.mp3'],['bird','🐦','audio/b-bird.mp3'],['bed','🛏️','audio/b-bed.mp3'],['banana','🍌','audio/b-banana.mp3'],['cat','🐱','audio/c-cat.mp3'],['cup','☕','audio/c-cup.mp3'],['car','🚗','audio/c-car.mp3'],['computer','💻','audio/c-computer.mp3'],['dog','🐶','audio/d-dog.mp3'],['desk','🪑','audio/d-desk.mp3'],['doll','🪆','audio/d-doll.mp3'],['duck','🦆','audio/d-duck.mp3'],['egg','🥚','audio/e-egg.mp3'],['elbow','💪','audio/e-elbow.mp3'],['envelope','✉️','audio/e-envelope.mp3'],['elephant','🐘','audio/e-elephant.mp3'],['fish','🐟','audio/f-fish.mp3'],['fan','🪭','audio/f-fan.mp3'],['farm','🏡','audio/f-farm.mp3'],['fork','🍴','audio/f-fork.mp3']];const $=s=>document.querySelector(s),board=$('#board'),feedback=$('#feedback'),total=words.length;let bag=[],answer=null,started=false,correct=0,slow=true,player=new Audio(),locked=false;const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};function play(){if(!answer)return;player.pause();if(!player.src.endsWith(answer[2])){player.src=answer[2];player.load()}player.currentTime=0;player.playbackRate=slow?.78:1;player.preservesPitch=true;player.mozPreservesPitch=true;player.webkitPreservesPitch=true;player.play().catch(()=>feedback.textContent='原声暂未播放，请再点一次')}function paint(){const done=total-bag.length;$('#score').textContent=correct+' / '+total;$('#bar').style.width=(done/total*100)+'%'}function ask(){locked=false;feedback.textContent='';if(!bag.length){$('#title').textContent='完成啦！';$('#hint').textContent='答对 '+correct+' 题，再来一轮吧！';$('#listen').textContent='🔁 再来一轮';board.innerHTML='';paint();started=false;return}answer=bag.shift();const choices=shuffle([answer,...shuffle(words.filter(x=>x!==answer)).slice(0,3)]);$('#title').textContent='听一听，点出正确图片';$('#hint').textContent='点击“再听一次”可重复播放';$('#listen').textContent='🔊 再听一次';board.innerHTML='';choices.forEach(w=>{const b=document.createElement('button');b.className='card';b.innerHTML=`<span class="pic">${w[1]}</span><span class="word">${w[0]}</span>`;b.onclick=()=>choose(w,b);board.appendChild(b)});paint()}function choose(w,b){if(locked||!started)return;if(w===answer){locked=true;correct++;b.classList.add('good');feedback.textContent='答对了！下一题来了';paint();setTimeout(()=>{ask();play()},700)}else{b.classList.add('bad');setTimeout(()=>b.classList.remove('bad'),300);feedback.textContent='再听一次，加油！';play()}}$('#listen').onclick=()=>{if(!started){started=true;bag=shuffle([...words]);correct=0;ask()}play()};$('#speed').onclick=e=>{slow=!slow;e.currentTarget.textContent=slow?'🐢 慢速':'🐇 正常';if(started)play()};paint()})();
</script></body></html>
