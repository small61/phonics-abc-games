<script>
(()=>{'use strict';
const defaults={A:[['apple','🍎'],['ant','🐜'],['alligator','🐊'],['axe','🪓']],B:[['bear','🐻'],['bird','🐦'],['bed','🛏️'],['banana','🍌']],C:[['cat','🐱'],['cup','☕'],['car','🚗'],['computer','💻']],D:[['dog','🐶'],['desk','🪑'],['doll','🪆'],['duck','🦆']],E:[['egg','🥚'],['elbow','💪'],['envelope','✉️'],['elephant','🐘']],F:[['fish','🐟'],['fan','🪭'],['farm','🏡'],['fork','🍴']]};

const pictures={farm:'assets/farm-card.png'};
const $=s=>document.querySelector(s),board=$('#board'),feedback=$('#feedback');let unit='A',words=load('A'),target=0,stars=0,slow=false,locked=false,timer=0,voices=[],questionBag=[],lastTarget=null,currentAudio=null,testing=false,lastHeard=null,wolfPx=58,actx=null;

function esc(s){const d=document.createElement('div');d.textContent=String(s);return d.innerHTML}function attr(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function shuffle(a){for(let i=a.length-1;i;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function nextTarget(){if(!questionBag.length){questionBag=shuffle([0,1,2,3]);if(lastTarget!==null&&questionBag[0]===lastTarget)[questionBag[0],questionBag[1]]=[questionBag[1],questionBag[0]]}target=questionBag.shift();lastTarget=target}

function lungeWolf(){const el=$('#wolf');if(!el)return;el.classList.remove('lunge');void el.offsetWidth;el.classList.add('lunge');setTimeout(()=>el.classList.remove('lunge'),620)}

function resetWolf(){wolfPx=58;paintWolf()}

function speak(text){if(currentAudio){currentAudio.pause();currentAudio=null}if('speechSynthesis'in window)speechSynthesis.cancel();const src=recordings[text.toLowerCase()];if(!src){synth(text);return}const audio=new Audio(src);audio.preload='auto';audio.playbackRate=slow?.78:1;audio.preservesPitch=true;audio.mozPreservesPitch=true;audio.webkitPreservesPitch=true;currentAudio=audio;audio.play().catch(()=>{if(currentAudio===audio)feedback.textContent='原声暂未播放，请再点一次';})}
$('#listen').onclick=startTest;$('#speed').onclick=e=>{slow=!slow;e.currentTarget.textContent=slow?'🐢 慢速':'🐇 正常';e.currentTarget.setAttribute('aria-pressed',String(!slow));if(testing)speak(words[target].word);else if(lastHeard!==null)speak(words[lastHeard].word)};
$('#unitSelect').onchange=e=>{unit=e.currentTarget.value;words=load(unit);stars=0;resetWolf();testing=false;lastHeard=null;resetQuestions();paintStars();mode();$('#subtitle').textContent='LETTER '+unit+' ADVENTURE';feedback.textContent='';draw()};
function fill(){ $('#editgrid').innerHTML=words.map((w,i)=>`<div class="editrow"><input class="emoji" maxlength="4" aria-label="第${i+1}个图标" value="${attr(w.emoji)}"><input class="wordinput" maxlength="24" autocapitalize="none" spellcheck="false" aria-label="第${i+1}个英文单词" value="${attr(w.word)}"></div>`).join('')}
$('#settings').onclick=()=>{fill();$('#editor').showModal()};$('#reset').onclick=()=>{words=defaults[unit].map(x=>({word:x[0],emoji:x[1]}));fill()};$('#form').onsubmit=e=>{if(e.submitter?.value!=='save')return;const next=[...document.querySelectorAll('.editrow')].map(r=>({emoji:r.querySelector('.emoji').value.trim()||'🔤',word:r.querySelector('.wordinput').value.trim().toLowerCase()}));if(next.some(x=>!x.word)){e.preventDefault();return}words=next;save();testing=false;lastHeard=null;resetQuestions();resetWolf();mode();draw()};$('#again').onclick=()=>{stars=0;resetWolf();paintStars();$('#celebrate').classList.remove('show');round(true)};
refresh();if('speechSynthesis'in window)speechSynthesis.onvoiceschanged=refresh;addEventListener('resize',paintWolf);addEventListener('orientationchange',()=>setTimeout(paintWolf,120));paintStars();mode();draw();
})();
</script>
</body></html>
