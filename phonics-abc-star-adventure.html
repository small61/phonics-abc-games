<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#173f5f"><meta name="apple-mobile-web-app-capable" content="yes">
<title>ABC 小动物闯关</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23ffd84d'/%3E%3Cpath d='m32 9 7 14 16 2-12 11 3 16-14-8-14 8 3-16L9 25l16-2z' fill='%23173f5f'/%3E%3C/svg%3E">
<style>
:root{--navy:#173f5f;--blue:#3ca7dd;--yellow:#ffd84d;--coral:#ff6b5e;--green:#51c89d;--cream:#fff9e9;--ink:#19343f;--shadow:0 12px 28px #173f5f25}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--cream);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}body{min-height:100svh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}button,input{font:inherit}button{cursor:pointer;touch-action:manipulation}.app{width:min(960px,100%);min-height:100svh;margin:auto;padding:16px clamp(14px,4vw,34px) 24px;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{display:flex;align-items:center;gap:11px}.logo{width:56px;height:56px;border-radius:18px;background:var(--yellow);display:grid;place-items:center;font-size:2rem;box-shadow:0 6px 0 #e7b72b}h1{font-size:clamp(1.25rem,4vw,1.9rem);line-height:1.1;margin:0;color:var(--navy)}h1 small{display:block;margin-top:4px;font-size:.76rem;letter-spacing:.06em;color:#68808a}.round-btn{width:50px;height:50px;border:0;border-radius:16px;background:#fff;box-shadow:var(--shadow);font-size:1.35rem}
.toprow{display:grid;grid-template-columns:1fr auto;gap:12px}.units{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:#e4efed;border-radius:18px;padding:6px}.unit{min-height:46px;border:0;border-radius:13px;background:transparent;color:#60777f;font:bold 1.25rem Georgia}.unit.on{background:#fff;color:var(--navy);box-shadow:0 3px 10px #173f5f18}.stars{display:flex;align-items:center;gap:2px;background:var(--navy);border-radius:18px;padding:8px 12px}.star{filter:grayscale(1);opacity:.35;font-size:1.25rem}.star.on{filter:none;opacity:1;animation:pop .35s}
.journey{position:relative;height:76px;border-radius:22px;background:linear-gradient(#bcecff 0 58%,#91d57d 58%);overflow:hidden;box-shadow:inset 0 -8px 0 #69b65c}.path{position:absolute;left:8%;right:9%;bottom:14px;height:7px;border-radius:9px;background:#f4e5ad}.animal{position:absolute;left:7%;bottom:19px;font-size:2.7rem;line-height:1;transform:translateX(-50%);transition:left .6s cubic-bezier(.2,.9,.25,1.25)}.finish{position:absolute;right:4%;bottom:19px;font-size:2.7rem}.cloud{position:absolute;top:7px;left:22%;font-size:1.25rem;opacity:.8}.cloud.two{left:62%;top:4px}
.game{background:#fff;border-radius:28px;padding:18px;box-shadow:var(--shadow);flex:1;display:flex;flex-direction:column;gap:14px;min-height:430px}.mission{text-align:center}.mission h2{font-size:clamp(1.25rem,4vw,1.75rem);margin:0;color:var(--navy)}.mission p{margin:5px 0 0;color:#687f87;font-weight:700;min-height:24px}.listen{align-self:center;border:0;border-radius:20px;min-height:66px;padding:0 32px;background:var(--coral);color:#fff;font-size:1.25rem;font-weight:900;box-shadow:0 6px 0 #d84c43}.listen:active{transform:translateY(3px);box-shadow:0 3px 0 #d84c43}.speed{align-self:center;border:2px solid #d6e2e3;border-radius:999px;background:#fff;min-height:42px;padding:0 18px;color:var(--navy);font-weight:800}
.board{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;flex:1}.card{border:3px solid transparent;border-radius:23px;background:#f8fbfb;min-height:145px;padding:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;color:var(--ink);box-shadow:0 6px 14px #173f5f15;position:relative;overflow:hidden}.card .pic{font-size:clamp(3rem,11vw,5rem);line-height:1}.card .word{font:900 clamp(1.15rem,4.5vw,1.7rem) Georgia}.card.good{border-color:#32b887;background:#e8fff6;animation:pop .45s}.card.no{border-color:var(--coral);animation:shake .3s}
.feedback{text-align:center;min-height:28px;font-size:1.05rem;font-weight:900;color:#168161}.help{text-align:center;color:#789097;font-size:.86rem;font-weight:700}
dialog{border:0;border-radius:26px;padding:0;width:min(92vw,560px);box-shadow:0 25px 80px #071d2866}dialog::backdrop{background:#102f3d99;backdrop-filter:blur(3px)}.modal{padding:24px}.modal h2{margin:0 0 5px;color:var(--navy)}.modal p{margin:0 0 16px;color:#60777f}.editgrid{display:grid;gap:10px}.editrow{display:grid;grid-template-columns:64px 1fr;gap:9px}.editrow input{min-height:52px;border:2px solid #d4e0e2;border-radius:14px;padding:8px 12px}.emoji{text-align:center;font-size:1.5rem}.actions{display:flex;gap:9px;margin-top:18px}.actions button{border:0;border-radius:14px;min-height:50px;padding:0 18px;font-weight:900}.save{flex:1;background:var(--navy);color:#fff}.reset{background:#eaf0f0;color:var(--navy)}
.celebrate{position:fixed;inset:0;background:#173f5fe8;display:none;place-items:center;z-index:10;padding:20px}.celebrate.show{display:grid}.party{width:min(470px,92vw);text-align:center;background:#fff;border-radius:32px;padding:34px 20px;box-shadow:0 24px 90px #0005;animation:party .5s}.party .big{font-size:5rem}.party h2{font-size:2rem;margin:8px 0;color:var(--navy)}.party p{font-weight:800;color:#5f7880}.party button{border:0;border-radius:18px;background:var(--yellow);color:var(--navy);min-height:58px;padding:0 28px;font-weight:950;font-size:1.1rem;box-shadow:0 6px 0 #dda91e}
@keyframes pop{50%{transform:scale(1.08)}}@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}@keyframes party{from{transform:scale(.65) rotate(-4deg);opacity:0}}:focus-visible{outline:4px solid var(--yellow);outline-offset:3px}@media(max-width:430px){.app{padding-inline:11px}.game{padding:14px;min-height:410px}.card{min-height:130px}.stars{padding-inline:8px}.star{font-size:1rem}}@media(orientation:landscape) and (max-height:680px){.app{gap:8px;padding-top:8px}.logo{width:44px;height:44px}.toprow{margin-top:4px}.journey{height:62px}.game{min-height:340px;padding:12px}.board{grid-template-columns:repeat(4,1fr)}.card{min-height:150px}.mission p{margin-top:2px}.listen{min-height:54px}.card .pic{font-size:3.4rem}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="app">
<header><div class="brand"><div class="logo">🐰</div><h1>ABC 小动物闯关<small id="subtitle">LETTER A ADVENTURE</small></h1></div><button class="round-btn" id="settings" aria-label="编辑单词">⚙️</button></header>
<div class="toprow"><nav class="units" aria-label="选择字母"><button class="unit on" data-unit="A" aria-current="page">A</button><button class="unit" data-unit="B">B</button><button class="unit" data-unit="C">C</button></nav><div class="stars" id="stars" aria-label="星星进度"></div></div>
<div class="journey" aria-label="小动物闯关进度"><span class="cloud">☁️</span><span class="cloud two">☁️</span><div class="path"></div><span class="animal" id="animal">🐰</span><span class="finish">🏠</span></div>
<section class="game" id="game"><div class="mission"><h2 id="title">听一听，点出正确图片</h2><p id="hint">每轮四个单词都会出现一次</p></div><button class="listen" id="listen">🔊 播放单词</button><button class="speed" id="speed" aria-pressed="false">🐢 慢速</button><div class="board" id="board"></div><div class="feedback" id="feedback" aria-live="assertive"></div><div class="help">答对获得星星 · 集齐 5 颗有惊喜</div></section>
</main>
<dialog id="editor"><form class="modal" method="dialog" id="form"><h2>修改本组单词</h2><p>图标和英文都可以更换，保存在本设备。</p><div class="editgrid" id="editgrid"></div><div class="actions"><button type="button" class="reset" id="reset">恢复默认</button><button value="save" class="save">保存</button></div></form></dialog>
<div class="celebrate" id="celebrate" role="dialog" aria-modal="true" aria-label="闯关成功"><div class="party"><div class="big">🐰🏠🎉</div><h2>到家啦！</h2><p>你帮助小兔完成了闯关！</p><button id="again">再闯一次</button></div></div>
<script>
(()=>{'use strict';
const defaults={A:[['apple','🍎'],['ant','🐜'],['alligator','🐊'],['ax','🪓']],B:[['bear','🐻'],['bird','🐦'],['bed','🛏️'],['banana','🍌']],C:[['cat','🐱'],['cup','☕'],['car','🚗'],['computer','💻']]};
const $=s=>document.querySelector(s),board=$('#board'),feedback=$('#feedback');let unit='A',words=load('A'),target=0,stars=0,slow=true,locked=false,timer=0,voices=[],questionBag=[],lastTarget=null;
function load(u){try{const x=JSON.parse(localStorage.getItem('phonics-adventure-'+u));if(Array.isArray(x)&&x.length===4&&x.every(v=>v.word))return x}catch(_){}return defaults[u].map(x=>({word:x[0],emoji:x[1]}))}
function save(){try{localStorage.setItem('phonics-adventure-'+unit,JSON.stringify(words))}catch(_){}}
function esc(s){const d=document.createElement('div');d.textContent=String(s);return d.innerHTML}function attr(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function shuffle(a){for(let i=a.length-1;i;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function nextTarget(){if(!questionBag.length){questionBag=shuffle([0,1,2,3]);if(lastTarget!==null&&questionBag[0]===lastTarget)[questionBag[0],questionBag[1]]=[questionBag[1],questionBag[0]]}target=questionBag.shift();lastTarget=target}
function resetQuestions(){questionBag=[];lastTarget=null}
function draw(){clearTimeout(timer);board.className='board';board.innerHTML='';shuffle(words.map((w,i)=>({w,i}))).forEach(({w,i})=>{const b=document.createElement('button');b.className='card';b.dataset.i=i;b.setAttribute('aria-label',w.word);b.innerHTML=`<span class="pic">${esc(w.emoji)}</span><span class="word">${esc(w.word)}</span>`;b.onclick=()=>pick(i,b);board.appendChild(b)})}
function round(play=false){locked=false;feedback.textContent='';nextTarget();draw();if(play)speak(words[target].word)}
function pick(i,b){if(locked)return;if(i===target){locked=true;b.classList.add('good');feedback.textContent='答对了！小兔前进一步！跟我读：'+words[i].word+' 👏';speak(words[i].word);earn();timer=setTimeout(()=>round(false),1100)}else{b.classList.add('no');setTimeout(()=>b.classList.remove('no'),350);feedback.textContent='再听一次，加油！';speak(words[target].word)}}
function earn(){stars=Math.min(5,stars+1);paintStars();if(stars===5)setTimeout(()=>{$('#celebrate').classList.add('show');speak('Amazing! Great job!')},650)}function paintStars(){$('#stars').innerHTML=Array.from({length:5},(_,i)=>`<span class="star ${i<stars?'on':''}">⭐</span>`).join('');$('#animal').style.left=(7+stars*16.6)+'%'}
function refresh(){voices=window.speechSynthesis?.getVoices?.()||[]}function voice(){const en=voices.filter(v=>/^en/i.test(v.lang));return en.find(v=>/samantha|karen|moira|tessa|ava|zira|female/i.test(v.name))||en.find(v=>/en-US/i.test(v.lang))||en[0]}
function speak(text){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();refresh();const u=new SpeechSynthesisUtterance(text),v=voice();if(v){u.voice=v;u.lang=v.lang}else u.lang='en-US';u.rate=slow?.72:.93;u.pitch=1.06;speechSynthesis.speak(u)}
$('#listen').onclick=()=>speak(words[target].word);$('#speed').onclick=e=>{slow=!slow;e.currentTarget.textContent=slow?'🐢 慢速':'🐇 正常';e.currentTarget.setAttribute('aria-pressed',String(!slow));speak(words[target].word)};
document.querySelectorAll('.unit').forEach(b=>b.onclick=()=>{unit=b.dataset.unit;words=load(unit);stars=0;resetQuestions();paintStars();document.querySelectorAll('.unit').forEach(x=>{x.classList.toggle('on',x===b);x===b?x.setAttribute('aria-current','page'):x.removeAttribute('aria-current')});$('#subtitle').textContent='LETTER '+unit+' ADVENTURE';round(false)});
function fill(){ $('#editgrid').innerHTML=words.map((w,i)=>`<div class="editrow"><input class="emoji" maxlength="4" aria-label="第${i+1}个图标" value="${attr(w.emoji)}"><input class="wordinput" maxlength="24" autocapitalize="none" spellcheck="false" aria-label="第${i+1}个英文单词" value="${attr(w.word)}"></div>`).join('')}
$('#settings').onclick=()=>{fill();$('#editor').showModal()};$('#reset').onclick=()=>{words=defaults[unit].map(x=>({word:x[0],emoji:x[1]}));fill()};$('#form').onsubmit=e=>{if(e.submitter?.value!=='save')return;const next=[...document.querySelectorAll('.editrow')].map(r=>({emoji:r.querySelector('.emoji').value.trim()||'🔤',word:r.querySelector('.wordinput').value.trim().toLowerCase()}));if(next.some(x=>!x.word)){e.preventDefault();return}words=next;save();resetQuestions();round(false)};$('#again').onclick=()=>{stars=0;paintStars();$('#celebrate').classList.remove('show');round(false)};
refresh();if('speechSynthesis'in window)speechSynthesis.onvoiceschanged=refresh;paintStars();round(false);
})();
</script>
</body></html>
